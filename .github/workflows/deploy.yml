name: deploy

# Builds the site and publishes it to GitHub Pages. The data files are read from
# the repo as committed; nothing is fetched from NASA at build time or at runtime.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than publishing a half-built site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Build
        # A project site is served from /<repo>/, so the asset base has to match.
        # Taking it from the repo name keeps a fork or a rename working.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # Pages must already be enabled on the repository, with its source set to
      # GitHub Actions -- see "Deploying" in the README. This action's
      # `enablement` input can create the site instead, but it needs
      # administration:write, which a workflow's GITHUB_TOKEN cannot be granted,
      # so it would only swap this failure for a permissions one.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
