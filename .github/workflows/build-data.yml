name: build-data

# NASA refreshes GISTEMP around the middle of each month; rebuild on the 20th
# and commit the two data files, which is what the site actually serves.
on:
  schedule:
    - cron: "0 6 20 * *"
  workflow_dispatch:

concurrency:
  group: build-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Test the build pipeline
        run: pytest tests -q

      - name: Build the data files
        run: python scripts/build_gistemp.py | tee summary.txt

      - name: Publish the summary
        run: |
          {
            echo '### GISTEMP build'
            echo '```'
            cat summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm summary.txt

      - name: Commit the data if it changed
        run: |
          # The JSON carries a build date, so it always differs. Only the binary
          # changing means NASA actually published new numbers.
          if git diff --quiet -- public/data/gistemp_annual.bin; then
            echo "No change in gistemp_annual.bin; leaving the repo alone."
            git checkout -- public/data
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/gistemp_annual.bin public/data/gistemp_annual.json
          git commit -m "data: rebuild GISTEMP annual means ($(date -u +%Y-%m-%d))"
          git push
